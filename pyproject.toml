[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipemix"
version = "0.1.0"
description = "Route audio to multiple output devices simultaneously on Linux"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "dbus-python",
]

[project.scripts]
pipemix = "pipemix.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pipemix"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md"]
