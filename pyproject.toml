[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipemix"
version = "0.3.0"
description = "Route audio to multiple output devices simultaneously on Linux, Windows and macOS"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }

# Linux runtime needs pactl and PyGObject (GTK4 + Gio for D-Bus) from the
# system packages. Windows needs pycaw, which brings comtypes and psutil:
# it hand-declares the WASAPI interfaces we would otherwise write out, and
# does it without comtypes' GetModule, which would not survive PyInstaller.
dependencies = [
    "pycaw>=20240210; sys_platform == 'win32'",
    # Linux gets pywebview from the distro alongside PyGObject; on Windows
    # and macOS there is no system package to get it from, and the GUI will
    # not start without it. macOS needs nothing else: Core Audio is reached
    # through ctypes.
    "pywebview>=5.0; sys_platform == 'win32' or sys_platform == 'darwin'",
]

[project.scripts]
pipemix = "pipemix.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pipemix"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md"]
